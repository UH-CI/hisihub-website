<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06101b">
  <meta name="description" content="Hawai'i Super Intelligence Hub. Coming soon.">
  <title>Hawai'i SI Hub | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://images.unsplash.com">
  <style>
    :root {
      color-scheme: light;
      --forest: #123a32;
      --forest-deep: #0b2924;
      --leaf: #d5e1c7;
      --paper: #f7f6ef;
      --white: #fffefa;
      --coral: #e36e50;
      --sun: #f2c65d;
      --ink: #18332e;
      --muted: #64736b;
      --line: #d9dfd5;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button, input { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .topbar { position: relative; z-index: 5; background: var(--forest-deep); color: var(--white); }
    .nav-wrap { width: min(1200px, calc(100% - 64px)); min-height: 78px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(255,255,255,.5); border-radius: 50%; color: var(--sun); font-size: 19px; line-height: 1; }
    .brand small { display: block; margin-top: 2px; color: #bed0c6; font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { color: #e1e9e2; font-size: 13px; text-decoration: none; }
    .nav-links a:hover { color: var(--sun); }
    .nav-links .nav-cta { padding: 10px 15px; border: 1px solid rgba(255,255,255,.4); border-radius: 3px; }
    .menu-toggle { display: none; border: 1px solid rgba(255,255,255,.45); border-radius: 3px; padding: 8px 11px; color: white; background: transparent; cursor: pointer; }

    .hero { position: relative; min-height: 560px; overflow: hidden; color: white; background: var(--forest); }
    .hero::before { position: absolute; inset: 0 0 0 35%; content: ""; background-image: linear-gradient(90deg, var(--forest) 0%, rgba(18,58,50,.84) 22%, rgba(18,58,50,.05) 75%), linear-gradient(0deg, rgba(11,41,36,.42), transparent 58%), url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=2000&q=85"); background-position: center, center, center 58%; background-size: cover; }
    .hero-inner { position: relative; width: min(1200px, calc(100% - 64px)); min-height: 560px; margin: 0 auto; display: flex; align-items: center; }
    .hero-copy { width: min(620px, 68%); padding: 72px 0 83px; animation: arrive .65s ease-out both; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 19px; color: var(--sun); font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { width: 29px; height: 1px; content: ""; background: currentColor; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 600px; margin-bottom: 20px; font-family: var(--serif); font-size: clamp(54px, 6.4vw, 82px); font-weight: 400; line-height: .99; letter-spacing: 0; }
    .hero-copy > p:not(.eyebrow) { max-width: 475px; margin-bottom: 28px; color: #d9e5dd; font-size: 16px; line-height: 1.7; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 12px; padding: 0 17px; border: 1px solid transparent; border-radius: 3px; font-size: 13px; font-weight: 700; text-decoration: none; transition: background .2s ease, transform .2s ease; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { color: var(--forest-deep); background: var(--sun); }
    .button-primary:hover { background: #ffda7b; }
    .button-quiet { color: white; border-color: rgba(255,255,255,.5); background: transparent; }
    .button-quiet:hover { background: rgba(255,255,255,.1); }
    .hero-note { position: absolute; right: 0; bottom: 32px; display: flex; align-items: center; gap: 10px; color: white; font-size: 11px; letter-spacing: .04em; }
    .hero-note span { width: 6px; height: 6px; border-radius: 50%; background: var(--sun); }

    .quickbar { position: relative; z-index: 2; margin-top: -1px; color: var(--forest); background: var(--sun); }
    .quickbar-inner { width: min(1200px, calc(100% - 64px)); min-height: 76px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .quickbar-label { font-family: var(--serif); font-size: 21px; white-space: nowrap; }
    .quick-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .quick-links a { padding: 9px 12px; border: 1px solid rgba(18,58,50,.3); border-radius: 2px; font-size: 12px; font-weight: 600; text-decoration: none; transition: color .2s ease, background .2s ease; }
    .quick-links a:hover { color: white; background: var(--forest); }

    .section { padding: 90px 0; }
    .section-inner { width: min(1200px, calc(100% - 64px)); margin: 0 auto; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 33px; }
    .section-heading h2 { max-width: 580px; margin-bottom: 0; font-family: var(--serif); font-size: clamp(36px, 4vw, 54px); font-weight: 400; line-height: 1.06; letter-spacing: 0; }
    .section-heading p { max-width: 390px; margin-bottom: 3px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .resources { background: var(--paper); }
    .directory-tools { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 23px; padding: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-button { min-height: 35px; padding: 0 12px; border: 1px solid transparent; border-radius: 2px; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; }
    .filter-button:hover, .filter-button[aria-pressed="true"] { border-color: var(--forest); color: var(--white); background: var(--forest); }
    .search-box { display: flex; width: min(285px, 100%); min-height: 39px; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid var(--line); border-radius: 2px; background: var(--white); }
    .search-box span { color: var(--muted); font-size: 15px; }
    .search-box input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 12px; }
    .search-box input::placeholder { color: #7c8981; }
    .resource-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .resource-card { min-height: 260px; display: flex; flex-direction: column; align-items: flex-start; padding: 24px 24px 21px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,254,250,.48); transition: background .2s ease; }
    .resource-card:hover { background: var(--white); }
    .resource-card[hidden] { display: none; }
    .resource-type { margin-bottom: 22px; color: #60786a; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .resource-card h3 { margin-bottom: 9px; font-family: var(--serif); font-size: 25px; font-weight: 400; line-height: 1.12; }
    .resource-card p { margin-bottom: 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .resource-card a { display: inline-flex; align-items: center; gap: 9px; margin-top: auto; color: var(--forest); font-size: 12px; font-weight: 700; text-decoration: none; }
    .resource-card a:hover { color: #a94731; }
    .empty-state { display: none; padding: 40px 0; color: var(--muted); font-size: 14px; }
    .empty-state.visible { display: block; }

    .field-notes { position: relative; overflow: hidden; color: var(--white); background: var(--forest); }
    .field-notes::after { position: absolute; right: -90px; bottom: -180px; width: 440px; height: 440px; border: 1px solid rgba(213,225,199,.16); border-radius: 50%; content: ""; box-shadow: 0 0 0 40px rgba(213,225,199,.025), 0 0 0 80px rgba(213,225,199,.025); pointer-events: none; }
    .field-notes .section-heading { position: relative; z-index: 1; }
    .field-notes .section-heading p { color: #bdd0c6; }
    .field-notes .eyebrow { color: var(--sun); }
    .notes-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr .85fr; gap: 1px; background: rgba(255,255,255,.2); }
    .note-feature, .note-aside { min-height: 280px; padding: 31px; background: var(--forest); }
    .note-feature { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; background: linear-gradient(130deg, rgba(18,58,50,.98), rgba(18,58,50,.85)), url("https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1100&q=80") center/cover; }
    .note-index { color: var(--sun); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .note-feature h3 { max-width: 470px; margin: 26px 0 10px; font-family: var(--serif); font-size: 35px; font-weight: 400; line-height: 1.08; }
    .note-feature p { max-width: 470px; margin-bottom: 18px; color: #cbdad0; font-size: 13px; line-height: 1.7; }
    .note-feature a, .note-aside a { color: var(--sun); font-size: 12px; font-weight: 700; text-decoration: none; }
    .note-aside { display: flex; flex-direction: column; justify-content: space-between; }
    .note-aside .note-index { color: #c4d6c9; }
    .note-aside h3 { max-width: 360px; margin: 30px 0 12px; font-family: var(--serif); font-size: 30px; font-weight: 400; line-height: 1.15; }
    .note-aside p { max-width: 390px; margin-bottom: 20px; color: #cbdad0; font-size: 13px; line-height: 1.7; }

    .principles { background: #e8ecdf; }
    .principle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding-top: 25px; border-top: 1px solid #c7d0c1; }
    .principle { padding-right: 18px; }
    .principle-number { display: inline-flex; width: 35px; height: 35px; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid #9aa99b; border-radius: 50%; color: var(--forest); font-family: var(--serif); font-size: 17px; }
    .principle h3 { margin-bottom: 8px; font-family: var(--serif); font-size: 24px; font-weight: 400; }
    .principle p { max-width: 310px; margin-bottom: 0; color: #5f7066; font-size: 13px; line-height: 1.7; }

    footer { color: #d7e3da; background: var(--forest-deep); }
    .footer-inner { width: min(1200px, calc(100% - 64px)); min-height: 110px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .footer-inner p { margin: 0; color: #aebfb4; font-size: 11px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 22px; }
    .footer-links a { color: #d7e3da; font-size: 11px; text-decoration: none; }
    .footer-links a:hover { color: var(--sun); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 760px) {
      .nav-wrap, .hero-inner, .quickbar-inner, .section-inner, .footer-inner { width: min(100% - 40px, 600px); }
      .nav-wrap { min-height: 68px; }
      .menu-toggle { display: block; }
      .nav-links { position: absolute; top: 68px; right: 0; left: 0; display: none; align-items: stretch; gap: 0; padding: 8px 20px 18px; background: var(--forest-deep); }
      .nav-links.open { display: flex; flex-direction: column; }
      .nav-links a { padding: 13px 0; border-top: 1px solid rgba(255,255,255,.12); }
      .nav-links .nav-cta { padding: 13px 0; border: 0; }
      .hero, .hero-inner { min-height: 570px; }
      .hero::before { inset: 0; opacity: .7; background-image: linear-gradient(90deg, rgba(18,58,50,.93), rgba(18,58,50,.38)), linear-gradient(0deg, rgba(11,41,36,.5), transparent), url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1100&q=80"); background-position: center, center, center; }
      .hero-copy { width: 100%; padding: 69px 0 82px; }
      h1 { max-width: 520px; font-size: clamp(53px, 12vw, 72px); }
      .hero-copy > p:not(.eyebrow) { max-width: 430px; font-size: 15px; }
      .hero-note { right: 0; bottom: 22px; }
      .quickbar-inner { align-items: flex-start; flex-direction: column; justify-content: center; gap: 11px; padding: 17px 0; }
      .quick-links { justify-content: flex-start; }
      .section { padding: 65px 0; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 14px; margin-bottom: 26px; }
      .section-heading p { max-width: 480px; }
      .directory-tools { align-items: stretch; flex-direction: column-reverse; gap: 13px; }
      .search-box { width: 100%; }
      .resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .resource-card { min-height: 270px; padding: 20px 17px; }
      .resource-card h3 { font-size: 22px; }
      .notes-grid { grid-template-columns: 1fr; }
      .note-feature, .note-aside { min-height: 250px; padding: 24px; }
      .principle-grid { grid-template-columns: 1fr; gap: 25px; }
      .principle { display: grid; grid-template-columns: 44px 1fr; column-gap: 12px; padding-right: 0; }
      .principle-number { grid-row: span 2; margin: 0; }
      .principle h3 { margin-bottom: 5px; }
      .footer-inner { align-items: flex-start; flex-direction: column; justify-content: center; padding: 27px 0; }
    }
    @media (max-width: 430px) {
      .resource-grid { grid-template-columns: 1fr; }
      .resource-card { min-height: 225px; }
      .hero-actions { align-items: stretch; flex-direction: column; max-width: 240px; }
      .button { justify-content: space-between; }
      .quick-links a { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    .launch-nav-link { color: var(--sun); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }
    .launch-hero, .launch-hero .hero-inner { min-height: 610px; }
    .launch-copy { width: min(710px, 100%); }
    .launch-copy h1 { max-width: 700px; font-size: 82px; line-height: 1.02; }
    .launch-copy > p:not(.eyebrow) { max-width: 540px; }
    .launch-status { display: inline-flex; align-items: center; gap: 9px; margin-top: 4px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.38); color: #f2e8c9; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .launch-status::before { width: 7px; height: 7px; border-radius: 50%; content: ""; background: var(--sun); }
    .launch-about { padding: 57px 0 64px; background: var(--sun); }
    .launch-about-inner { width: min(1200px, calc(100% - 64px)); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 48px; }
    .launch-about .eyebrow { margin-bottom: 12px; color: var(--forest); }
    .launch-about h2 { max-width: 560px; margin-bottom: 0; color: var(--forest); font-family: var(--serif); font-size: 38px; font-weight: 400; line-height: 1.12; }
    .launch-about p { max-width: 490px; margin: 0; color: #29463a; font-size: 14px; line-height: 1.8; }
    .launch-footer .footer-inner { min-height: 90px; }
    @media (max-width: 760px) {
      .launch-hero, .launch-hero .hero-inner { min-height: 590px; }
      .launch-copy { width: 100%; }
      .launch-copy h1 { max-width: 560px; font-size: 58px; }
      .launch-about { padding: 42px 0; }
      .launch-about-inner { width: min(100% - 40px, 600px); grid-template-columns: 1fr; gap: 18px; }
      .launch-about h2 { font-size: 32px; }
      .launch-footer .footer-inner { min-height: 78px; }
    }
    @media (max-width: 380px) {
      .launch-copy h1 { font-size: 49px; }
    }

    body { min-height: 100vh; overflow: hidden; color: #fff; background: #06101b; }
    .launch-screen { position: relative; display: grid; width: 100%; min-height: 100vh; min-height: 100svh; place-items: center; overflow: hidden; isolation: isolate; background: #06101b; }
    .image-wall { position: absolute; z-index: -2; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .image-panel { min-width: 0; background-position: center; background-size: cover; filter: saturate(.72) contrast(1.12); transform: scale(1.035); animation: reveal 1.2s ease-out both; }
    .image-panel:nth-child(2) { animation-delay: .12s; }
    .image-panel:nth-child(3) { animation-delay: .24s; }
    .image-panel--orbit { background-image: url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=85"); }
    .image-panel--circuit { background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=85"); }
    .image-panel--intelligence { background-image: url("https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=85"); }
    .launch-screen::before, .launch-screen::after { position: absolute; z-index: -1; inset: 0; content: ""; pointer-events: none; }
    .launch-screen::before { background: linear-gradient(90deg, rgba(3,10,18,.72), rgba(3,10,18,.4) 50%, rgba(3,10,18,.72)), linear-gradient(0deg, rgba(3,10,18,.56), transparent 50%, rgba(3,10,18,.3)); }
    .launch-screen::after { background: radial-gradient(ellipse at center, rgba(4,18,30,.04) 0%, rgba(4,18,30,.36) 68%, rgba(4,18,30,.72) 100%); }
    .launch-screen h1 { margin: 0; padding: 24px; color: #f1fcff; font-family: "Orbitron", "Arial", sans-serif; font-size: 72px; font-weight: 600; line-height: 1.1; letter-spacing: 0; text-align: center; text-shadow: 0 0 18px rgba(79,221,255,.85), 0 0 54px rgba(45,164,255,.55); animation: signal 1s .2s ease-out both; }
    @keyframes reveal { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: scale(1.035); } }
    @keyframes signal { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) {
      .image-wall { grid-template-columns: 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); }
      .image-panel { background-position: center 42%; }
      .launch-screen h1 { font-size: 48px; }
      .launch-screen::before { background: linear-gradient(90deg, rgba(3,10,18,.65), rgba(3,10,18,.32), rgba(3,10,18,.65)), linear-gradient(0deg, rgba(3,10,18,.58), transparent 50%, rgba(3,10,18,.4)); }
    }
    @media (max-width: 380px) {
      .launch-screen h1 { font-size: 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .image-panel, .launch-screen h1 { animation: none; }
    }
  </style>
</head>
<body>
  <main class="launch-screen" aria-label="Hawai'i Super Intelligence Hub">
    <div class="image-wall" aria-hidden="true">
      <div class="image-panel image-panel--orbit"></div>
      <div class="image-panel image-panel--circuit"></div>
      <div class="image-panel image-panel--intelligence"></div>
    </div>
    <h1>COMING SOON</h1>
  </main>
</body>
</html>
